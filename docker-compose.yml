# ============================================================
#  一键启动：docker compose up --build
#
#  启动后打开 http://localhost:8000
#  容器内已带公开示例语料，无需任何额外准备即可提问。
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-rag-agent:latest
    container_name: research-rag-agent
    ports:
      - "8000:8000"

    # 从 .env 读配置。⚠️ 代码现在同时支持「进程环境变量」与「.env 文件」，
    # 且进程环境变量优先 —— 所以这里传的值一定生效。
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内用挂载卷里的语料；默认已带公开示例语料
      CORPUS_DIR: /app/data/docs
      CHROMA_DIR: /app/data/chroma_db
      PARENT_STORE_DIR: /app/data/parent_store
      MANIFEST_PATH: /app/data/index_manifest.json
      DATABASE_PATH: /app/data/app.db
      HF_HOME: /models

    volumes:
      # 模型缓存：嵌入与重排模型约 1.2 GB，挂出来避免每次重建都重新下载
      - model_cache:/models
      # 索引与数据库：持久化，容器重建不丢会话与索引
      - app_data:/app/data
      # 想换成自己的私有语料时，取消下面这行注释并指向本地目录
      # - ./my_docs:/app/data/docs:ro

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  model_cache:
  app_data:
